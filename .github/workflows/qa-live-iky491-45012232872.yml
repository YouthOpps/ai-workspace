name: Verify the IKY production publication and complete live index

on:
  push:
    branches: [qa/iky491-live-45012232872]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 5cf48e0f38a845ea3b192aa8d05bb148d5648af8
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          ref: 8f3da0ec665dd776077b9cf4b9cb0d9c79fb8fcb
          path: data-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the reviewed site against the exact published data
        working-directory: website
        env:
          DATA_PATH: ${{ github.workspace }}/data-source/datas
        run: npm run build
      - name: Compare published site to the exact data revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/qa/verify-live-catalog-44796017283.py
          8f3da0ec665dd776077b9cf4b9cb0d9c79fb8fcb gr-iky
          --website-revision 5cf48e0f38a845ea3b192aa8d05bb148d5648af8
          --output ${{ runner.temp }}/live-catalog-44796017283.json
      - name: Verify every live source status, index and sitemap
        run: >-
          python -B .github/qa/verify-live-source-directory-44796017283.py
          8f3da0ec665dd776077b9cf4b9cb0d9c79fb8fcb
          --website-revision 5cf48e0f38a845ea3b192aa8d05bb148d5648af8
          --output ${{ runner.temp }}/live-source-directory-44796017283.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-catalog-44796017283
          path: |
            ${{ runner.temp }}/live-catalog-44796017283.json
            ${{ runner.temp }}/live-source-directory-44796017283.json
          if-no-files-found: error
          retention-days: 7
