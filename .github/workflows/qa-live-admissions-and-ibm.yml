name: Verify YouthOpps live admissions and IBM refresh

on:
  push:
    branches: [qa/live-health-44249583836]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 11e66b0107956ed82b9918206e18d8e8fc6778b1
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          ref: 2404d8c9d711fc8b505d22f297642c404789cea1
          path: data-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare published site to the exact data revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/qa/verify-live-admissions-and-ibm.py
          2404d8c9d711fc8b505d22f297642c404789cea1 at-klagenfurt-msc-international-management fr-universite-de-strasbourg-m1-admissions ibm
          --website-revision 11e66b0107956ed82b9918206e18d8e8fc6778b1
          --output ${{ runner.temp }}/live-admissions-and-ibm-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-admissions-and-ibm-index
          path: ${{ runner.temp }}/live-admissions-and-ibm-index.json
          if-no-files-found: error
          retention-days: 7
