name: Verify YouthOpps live catalogue release with Croatia and Federico II

on:
  push:
    branches: [qa/live-release-44254311727]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 761fc201675c349468ea94d027b021144564424b
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          ref: 7f8ba3f2a711de04ccbb01fbfb4afd6068f40aa0
          path: data-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare published site to the exact data revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/qa/verify-live-release-croatia-unina.py
          7f8ba3f2a711de04ccbb01fbfb4afd6068f40aa0 at-klagenfurt-msc-international-management fr-universite-de-strasbourg-m1-admissions ibm hr-study-in-croatia it-unina-apple-academy-foundation
          --website-revision 761fc201675c349468ea94d027b021144564424b
          --output ${{ runner.temp }}/live-release-croatia-unina-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-release-croatia-unina-index
          path: ${{ runner.temp }}/live-release-croatia-unina-index.json
          if-no-files-found: error
          retention-days: 7
