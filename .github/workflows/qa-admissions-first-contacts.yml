name: Admissions first contacts

on:
  push:
    branches:
      - qa/admission-first-contacts-422-423-425-r2

permissions:
  contents: read
  actions: read

jobs:
  contact:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created == true && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        source: [graz422, anu423, coimbra425]
    name: First contact ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: admissions-first-contact-${{ matrix.source }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture the bounded publisher responses
        env:
          SOURCE: ${{ matrix.source }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/admission-first-contact/run.py
      - name: Retain outcome, source state and encrypted complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-contact-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admissions-first-contact/${{ matrix.source }}/
          if-no-files-found: error
          retention-days: 3
