name: Record Greek Ministry received-redirect settlement
on:
  push:
    branches: [qa/465-greek-received-redirect-settlement]
permissions:
  contents: read
  actions: read
jobs:
  settle:
    if: false && github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the closed redirect and preserve the original journal lineage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/minedu465/settle.py
      - uses: actions/upload-artifact@v4
        with:
          name: minedu465-redirect-settlement
          path: ${{ runner.temp }}/minedu465-redirect-settlement
          if-no-files-found: error
          retention-days: 30
