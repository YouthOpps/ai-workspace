name: Verify Google and the five new admissions sources live index

on:
  push:
    branches: [qa/live-google-44199243620]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 21011e36b346111fa344d760bc7eff88a809a853
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          ref: 767a4804dda1c8664ec8fee0e423b41dd80094f5
          path: data-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare published site to the exact data revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/qa/verify-google-live-index.py
          767a4804dda1c8664ec8fee0e423b41dd80094f5 google es-uc3m-admissions pl-warsaw-tech-msc-admissions gr-auth-msen-admissions au-anu-international-admissions pt-coimbra-brazil-admissions
          --website-revision 21011e36b346111fa344d760bc7eff88a809a853
          --output ${{ runner.temp }}/google-live-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: google-live-index
          path: ${{ runner.temp }}/google-live-index.json
          if-no-files-found: error
          retention-days: 7
