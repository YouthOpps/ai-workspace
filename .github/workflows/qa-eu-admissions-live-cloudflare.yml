name: Verify Warsaw Tech and Aristotle University live index

on:
  push:
    branches: [qa/live-eu-admissions-44185274183]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 493e53db44e0d00979f6da9e3b876e9bdb9b8f63
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          ref: aca9bdfa99c2c826928826b4e2ce0d30817ad15e
          path: data-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare published site to the exact data revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/qa/verify-eu-admissions-live-index.py
          aca9bdfa99c2c826928826b4e2ce0d30817ad15e pl-warsaw-tech-msc-admissions gr-auth-msen-admissions
          --website-revision 493e53db44e0d00979f6da9e3b876e9bdb9b8f63
          --output ${{ runner.temp }}/eu-admissions-live-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: eu-admissions-live-index
          path: ${{ runner.temp }}/eu-admissions-live-index.json
          if-no-files-found: error
          retention-days: 7
