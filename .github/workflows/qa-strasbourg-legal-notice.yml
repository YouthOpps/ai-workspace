name: Strasbourg admissions legal notice

on:
  push:
    branches:
      - qa/strasbourg-legal-notice

permissions:
  contents: read
  actions: read

jobs:
  contact:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created == true && github.run_attempt == 1
    name: First contact strasbourg443legal
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: youthopps-universite-de-strasbourg-publisher-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture the bounded publisher responses
        env:
          SOURCE: strasbourg443legal
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/admission-first-contact/run.py
      - name: Retain outcome, source state and encrypted complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-notice-strasbourg443legal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admissions-first-contact/strasbourg443legal/
          if-no-files-found: error
          retention-days: 3
