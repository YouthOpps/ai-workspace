name: Verify the consolidated YouthOpps live release

on:
  push:
    branches: [qa/live-catalog-44518435237]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 349cdb585d931c97ca5adae16e921d61d778f401
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          ref: 2672068f183fc6351333cc2536fb4edafd8c0103
          path: data-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the reviewed site against the exact published data
        working-directory: website
        env:
          DATA_PATH: ${{ github.workspace }}/data-source/datas
        run: npm run build
      - name: Compare published site to the exact data revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/qa/verify-live-catalog-44518435237.py
          2672068f183fc6351333cc2536fb4edafd8c0103 cern-summer-studentships ch-eth-zurich-summer-research-fellowship fr-ens-paris-international-selection erasmus-mundus-glodep at-grants-at
          --website-revision 349cdb585d931c97ca5adae16e921d61d778f401
          --output ${{ runner.temp }}/live-catalog-44518435237.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-catalog-44518435237
          path: ${{ runner.temp }}/live-catalog-44518435237.json
          if-no-files-found: error
          retention-days: 7
