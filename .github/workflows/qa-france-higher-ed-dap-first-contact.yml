name: France higher-education international DAP first contact

on:
  push:
    branches:
      - qa/france-higher-ed-dap-first-contact

permissions:
  contents: read
  actions: read

jobs:
  contact:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created == true && github.run_attempt == 1
    name: First contact dapes462
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: france-higher-ed-dap-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture the bounded publisher responses
        env:
          SOURCE: dapes462
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/admission-first-contact/run.py
      - name: Retain outcome, source state and encrypted complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-contact-dapes462-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admissions-first-contact/dapes462/
          if-no-files-found: error
          retention-days: 3
