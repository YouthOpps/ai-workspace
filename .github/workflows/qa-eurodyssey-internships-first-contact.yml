name: Eurodyssey traineeship first contact

on:
  push:
    branches:
      - qa/eurodyssey-internships-first-contact

permissions:
  contents: read
  actions: read

jobs:
  contact:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created == true && github.event.deleted == false && github.run_attempt == 1
    name: First contact eurodyssey
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: youthopps-eurodyssey-publisher-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-pipeline
          ref: main
          path: .eurodyssey-pipeline
          persist-credentials: false
      - name: Capture exact Eurodyssey public responses
        env:
          SOURCE: eurodyssey
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/eurodyssey-first-contact/run.py
      - name: Retain outcome, state and encrypted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurodyssey-first-contact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eurodyssey-internships-first-contact/eurodyssey/
          if-no-files-found: error
          retention-days: 7
