name: Verify the consolidated YouthOpps live release

on:
  push:
    branches: [qa/live-catalog-45571861407-r2]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: d3fd7eb04b9faef1f76b2eacbace077b3b3415e5
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          ref: e76af2ac4e8c50b8e9abad9fc660df021ed0d75d
          path: data-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the reviewed site against the exact published data
        working-directory: website
        env:
          DATA_PATH: ${{ github.workspace }}/data-source/datas
        run: npm run build
      - name: Compare published site to the exact data revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/qa/verify-live-catalog-44796017283.py
          e76af2ac4e8c50b8e9abad9fc660df021ed0d75d nestle ibm se-arbetsformedlingen-jobsearch be-wbi dk-university-of-copenhagen at-university-of-vienna yildiz-pladis-careers pl-frse hu-fulbright-hungary dk-fulbright-center de-bmw-group
          --website-revision d3fd7eb04b9faef1f76b2eacbace077b3b3415e5
          --output ${{ runner.temp }}/live-catalog-44796017283.json
      - name: Verify every live source status, index and sitemap
        run: >-
          python -B .github/qa/verify-live-source-directory-44796017283.py
          e76af2ac4e8c50b8e9abad9fc660df021ed0d75d
          --website-revision d3fd7eb04b9faef1f76b2eacbace077b3b3415e5
          --output ${{ runner.temp }}/live-source-directory-44796017283.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-catalog-44796017283
          path: |
            ${{ runner.temp }}/live-catalog-44796017283.json
            ${{ runner.temp }}/live-source-directory-44796017283.json
          if-no-files-found: error
          retention-days: 7
