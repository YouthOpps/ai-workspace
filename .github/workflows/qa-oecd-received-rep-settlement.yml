name: Record OECD received-REP settlement
on:
  push:
    branches: [qa/466-oecd-received-rep-settlement]
permissions:
  contents: read
  actions: read
jobs:
  settle:
    if: true && github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the exact closed OECD REP receipt and preserve the original journal lineage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/oecd466/settle.py
      - uses: actions/upload-artifact@v4
        with:
          name: oecd466-rep-settlement
          path: ${{ runner.temp }}/oecd466-rep-settlement
          if-no-files-found: error
          retention-days: 30
