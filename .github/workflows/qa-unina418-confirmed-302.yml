name: Federico II university confirmed 302 continuation

on:
  push:
    branches:
      - qa/418-unina-confirmed-302

permissions:
  contents: read
  actions: read

jobs:
  contact:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created == true && github.run_attempt == 1
    name: First contact unina418state302
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: youthopps-unina-publisher-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture the bounded publisher responses
        env:
          SOURCE: unina418state302
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/admission-first-contact/run.py
      - name: Retain outcome, source state and encrypted complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confirmed-302-unina418state302-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admissions-first-contact/unina418state302/
          if-no-files-found: error
          retention-days: 3
