name: Verify Campus France live index

on:
  push:
    branches: [qa/417-live-index-44179200131]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: f4dd2f046855aa295a6e74be79603d79238fa0fa
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          ref: fb2730b5ee93124fffdb453b1c9fce0a34225335
          path: data-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare published site to the exact data revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/qa/verify-campus-live-index.py
          fb2730b5ee93124fffdb453b1c9fce0a34225335 fr-campus-france
          --website-revision f4dd2f046855aa295a6e74be79603d79238fa0fa
          --output ${{ runner.temp }}/campus-live-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: campus-live-index
          path: ${{ runner.temp }}/campus-live-index.json
          if-no-files-found: error
          retention-days: 7
