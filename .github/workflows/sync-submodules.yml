name: Sync submodules

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-submodules-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out workspace
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: true

      - name: Update submodules from origin/main
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync
          git submodule update --init --remote --checkout
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' |
            while read -r key path; do
              git add -- "$path"
            done

      - name: Commit and push updated references
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "All submodules are up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync submodule references"
          git push origin HEAD:main
