name: Record Hyundai received policy attestation
on:
  push:
    branches: [qa/251-hyundai-received-policy-attestation]
permissions:
  contents: read
  actions: read
jobs:
  settle:
    if: false && github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the assessed policy and preserve the original journal lineage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/hyundai251/settle.py
      - uses: actions/upload-artifact@v4
        with:
          name: hyundai251-policy-attestation
          path: ${{ runner.temp }}/hyundai251-policy-attestation
          if-no-files-found: error
          retention-days: 30
