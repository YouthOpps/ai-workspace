name: Record TU Graz received-response settlement
on:
  push:
    branches: [qa/422-graz-received-response-settlement]
permissions:
  contents: read
  actions: read
jobs:
  settle:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the original owner and derive the settled state without publisher access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B qa/graz422/settle.py
      - uses: actions/upload-artifact@v4
        with:
          name: graz-received-response-settlement
          path: ${{ runner.temp }}/graz-received-response-settlement
          if-no-files-found: error
          retention-days: 30
