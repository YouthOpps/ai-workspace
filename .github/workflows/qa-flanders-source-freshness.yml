name: Verify Flanders and Yildiz/pladis live index

on:
  push:
    branches: [qa/live-flanders-source-freshness-44194360772]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: e44ee2f94e55cc678b8a53a9828f2aef50996e25
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          ref: 069a645afe13801afc0c3394fd6cf287f844bc7c
          path: data-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare published site to the exact data revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/qa/verify-flanders-live-index.py
          069a645afe13801afc0c3394fd6cf287f844bc7c be-study-in-flanders yildiz-pladis-careers
          --website-revision e44ee2f94e55cc678b8a53a9828f2aef50996e25
          --output ${{ runner.temp }}/flanders-live-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: flanders-live-index
          path: ${{ runner.temp }}/flanders-live-index.json
          if-no-files-found: error
          retention-days: 7
