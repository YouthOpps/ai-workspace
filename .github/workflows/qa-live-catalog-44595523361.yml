name: Verify the consolidated YouthOpps live release

on:
  push:
    branches: [qa/live-catalog-44595523361]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 1b2c984afded432981cb5681d4bfb5cb715213e4
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          ref: 7bc734123640e02eb74d0cbe9cbc1d22cf85ff3f
          path: data-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the reviewed site against the exact published data
        working-directory: website
        env:
          DATA_PATH: ${{ github.workspace }}/data-source/datas
        run: npm run build
      - name: Compare published site to the exact data revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/qa/verify-live-catalog-44595523361.py
          7bc734123640e02eb74d0cbe9cbc1d22cf85ff3f be-study-in-flanders
          --website-revision 1b2c984afded432981cb5681d4bfb5cb715213e4
          --output ${{ runner.temp }}/live-catalog-44595523361.json
      - name: Verify every live source status, index and sitemap
        run: >-
          python -B .github/qa/verify-live-source-directory-44595523361.py
          7bc734123640e02eb74d0cbe9cbc1d22cf85ff3f
          --website-revision 1b2c984afded432981cb5681d4bfb5cb715213e4
          --output ${{ runner.temp }}/live-source-directory-44595523361.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-catalog-44595523361
          path: |
            ${{ runner.temp }}/live-catalog-44595523361.json
            ${{ runner.temp }}/live-source-directory-44595523361.json
          if-no-files-found: error
          retention-days: 7
