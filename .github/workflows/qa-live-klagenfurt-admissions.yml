name: Verify YouthOpps live Klagenfurt admissions

on:
  push:
    branches: [qa/live-admissions-44247017657]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'YouthOpps/ai-workspace' && github.event.created && !github.event.deleted && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/youthopps.github.io
          ref: 4b8becc04a45f88aa516d8d99da79d58b062d161
          path: website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          ref: cf9200517e897d4c6aed0f8d893111c3b750106c
          path: data-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare published site to the exact data revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B .github/qa/verify-live-klagenfurt-admissions.py
          cf9200517e897d4c6aed0f8d893111c3b750106c at-klagenfurt-msc-international-management
          --website-revision 4b8becc04a45f88aa516d8d99da79d58b062d161
          --output ${{ runner.temp }}/live-klagenfurt-admissions-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-klagenfurt-admissions-index
          path: ${{ runner.temp }}/live-klagenfurt-admissions-index.json
          if-no-files-found: error
          retention-days: 7
